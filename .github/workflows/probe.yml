# 除錯用：探測資料源的真實格式，結果上傳成 artifact（不動資料、不部署）
name: probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline
            tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe
