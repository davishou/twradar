# 除錯用：探測資料源的真實格式，結果上傳成 artifact（不動資料、不部署）
name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline
            tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/probe.py
      - name: 結果推到 probe 分支（不影響 main）
        run: |
          cd probe
          git init -q -b probe && git config user.name data-bot && git config user.email data-bot@users.noreply.github.com
          git add . && git commit -qm "probe $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
