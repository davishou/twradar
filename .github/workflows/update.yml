# 用 GitHub Actions 免費排程更新資料，並發佈到 GitHub Pages。
# 時間為 UTC（台灣時間 −8 小時）。GitHub 排程可能延遲 5~15 分鐘。
name: update-data

on:
  schedule:
    - cron: "5 9 * * 1-5"        # 17:05 漲停、隔日、統計、氣氛
    - cron: "40 10 * * 1-5"      # 18:40 重抓 17:05 失敗的券商分點
    - cron: "45 13 * * 1-5"      # 21:45 處置預測（等融資融券公布）
    - cron: "8 12 * * 1-5"       # 20:08 券差
    - cron: "30 14 * * 1-5"      # 22:30 主動 ETF
    - cron: "*/5 0-15 * * 1-5"   # 08:00~23:55 每 5 分鐘公告偵測
    - cron: "30 16 * * *"        # 00:30 長期資料庫回補歷史（先 10 年、再到 2004；補完後幾秒就結束）
  workflow_dispatch:
    inputs:
      job:
        description: "要執行的工作（daily / brokers / disposal / borrow / etf / announce / cb / cbhist / treasury / retheme / all / backfill / history；重跑某天：daily 2026-10-16）"
        default: "all"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event.schedule == '30 16 * * *' || github.event.inputs.job == 'history') && 300 || 30 }}
    environment:
      name: github-pages
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      AI_MODEL: ${{ vars.AI_MODEL || 'claude-haiku-5-5' }}
      SITE_NAME: ${{ vars.SITE_NAME || '盤後雷達' }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      # 長期資料庫的行情／法人／融資券（數百 MB）只有 history 工作需要讀；其他工作只寫入當天的新檔，
      # 所以不下載它們（稀疏 checkout），每 5 分鐘的公告工作才不會每次下載整個資料庫
      - uses: actions/checkout@v4
        if: github.event.schedule == '30 16 * * *' || github.event.inputs.job == 'history'
        with:
          ref: main   # 排隊等很久的工作也要從最新資料開始，避免存回時衝突
      - uses: actions/checkout@v4      # 可轉債歷史回補：要讀 cbq／cbb 才知道哪些天已補
        if: github.event.inputs.job == 'cbhist'
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/archive/quotes/
            !/data/archive/inst/
            !/data/archive/margin/
            !/data/archive/val/
      - uses: actions/checkout@v4
        if: github.event.schedule != '30 16 * * *' && github.event.inputs.job != 'history' && github.event.inputs.job != 'cbhist'
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/archive/quotes/
            !/data/archive/inst/
            !/data/archive/margin/
            !/data/archive/val/
            !/data/archive/cbq/
            !/data/archive/cbb/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 決定要跑哪個工作
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "5 9 * * 1-5")      JOB=daily ;;
            "40 10 * * 1-5")    JOB=brokers ;;
            "45 13 * * 1-5")    JOB=disposal ;;
            "8 12 * * 1-5")     JOB=borrow ;;
            "30 14 * * 1-5")    JOB=etf ;;
            "*/5 0-15 * * 1-5") JOB=announce ;;
            "30 16 * * *")      JOB=history ;;
            *)                  JOB="${{ github.event.inputs.job || 'all' }}" ;;
          esac
          echo "job=$JOB" >> "$GITHUB_OUTPUT"

      - name: 執行
        run: |
          if [ "${{ steps.pick.outputs.job }}" = "history" ]; then
            git config user.name "data-bot"
            git config user.email "data-bot@users.noreply.github.com"
            # 每 45 分鐘存一次，萬一中途被中斷也不會白跑
            # 每週六凌晨那一輪：少補一輪，留時間用最新的長期資料庫重跑 CB 回測（溫度計區間＋鄭大訊號）
            ROUNDS="1 2 3 4 5"; [ "$(TZ=Asia/Taipei date +%u)" = "6" ] && ROUNDS="1 2 3 4"
            for i in $ROUNDS; do
              # 平日 06:15 以後不再開新一輪，避免回補拖到盤後工作（排程延遲時也一樣）
              now=$(TZ=Asia/Taipei date +%H%M); dow=$(TZ=Asia/Taipei date +%u)
              if [ "$dow" -le 5 ] && [ "$now" -ge 0615 ] && [ "$now" -lt 2300 ]; then echo "平日白天，下次再續"; break; fi
              python -m pipeline.run history 45
              git add --sparse data
              if ! git diff --cached --quiet; then
                git commit -m "data: history $(TZ=Asia/Taipei date '+%F %R')"
                git pull --rebase --autostash && git push
              fi
              # 時間到、或 10 年剛補完要接著往前補，就繼續下一輪
              python -c "import json,sys; p=json.load(open('data/archive/progress.json')); sys.exit(0 if p.get('stopped')=='時間到' or (p.get('stopped')=='完成' and not p.get('complete')) else 1)" || break
            done
            if [ "$(TZ=Asia/Taipei date +%u)" = "6" ]; then
              pip install -q -r requirements-backtest.txt
              timeout 40m python -m research.cb_market > /dev/null || echo "CB 溫度計回測失敗"
              timeout 50m python -m research.cb_signals | tail -40 || echo "CB 訊號回測失敗"
            fi
          elif [ "${{ steps.pick.outputs.job }}" = "backfill" ]; then
            python -m pipeline.run backfill 120 && python -m pipeline.run all
          else
            python -m pipeline.run ${{ steps.pick.outputs.job }}
          fi

      - name: 存回資料
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add --sparse data site/data themes.json
          if git diff --cached --quiet; then echo "沒有變更"; else
            git commit -m "data: ${{ steps.pick.outputs.job }} $(TZ=Asia/Taipei date '+%F %R')"
            git pull --rebase --autostash && git push
          fi

      - name: 密碼頁（GitHub Secret SITE_PASSWORD；沒設就不鎖）
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          python -c "import hashlib,os,json; p=os.environ.get('SITE_PASSWORD','').strip(); json.dump({'h': hashlib.sha256(('twradar:'+p).encode()).hexdigest()} if p else {}, open('site/gate.json','w'))"

      - name: 專案容量（網站在 800MB 以上時顯示提醒）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kb=$(gh api repos/${{ github.repository }} -q .size 2>/dev/null || echo 0)
          echo "{\"mb\": $((kb / 1024)), \"at\": \"$(TZ=Asia/Taipei date '+%F %R')\"}" > site/repo_size.json
          cat site/repo_size.json

      - name: 小走勢圖（每次部署從 data/history 產生，不進 git）
        run: |
          python -m pipeline.spark || echo "小走勢圖產生失敗，網站照常部署"
          python -m pipeline.cb hist || echo "可轉債走勢檔產生失敗"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
