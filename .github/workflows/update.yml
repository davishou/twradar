# 用 GitHub Actions 免費排程更新資料，並發佈到 GitHub Pages。
# 時間為 UTC（台灣時間 −8 小時）。GitHub 排程可能延遲 5~15 分鐘。
name: update-data

on:
  schedule:
    - cron: "5 9 * * 1-5"        # 17:05 漲停、隔日、統計、氣氛
    - cron: "40 10 * * 1-5"      # 18:40 重抓 17:05 失敗的券商分點
    - cron: "45 13 * * 1-5"      # 21:45 處置預測（等融資融券公布）
    - cron: "8 12 * * 1-5"       # 20:08 券差
    - cron: "30 14 * * 1-5"      # 22:30 主動 ETF
    - cron: "*/5 0-15 * * 1-5"   # 08:00~23:55 每 5 分鐘公告偵測
  workflow_dispatch:
    inputs:
      job:
        description: "要執行的工作（daily / brokers / disposal / borrow / etf / announce / all / backfill；重跑某天：daily 2026-10-16）"
        default: "all"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      AI_MODEL: ${{ vars.AI_MODEL || 'claude-haiku-5-5' }}
      SITE_NAME: ${{ vars.SITE_NAME || '盤後雷達' }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 決定要跑哪個工作
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "5 9 * * 1-5")      JOB=daily ;;
            "40 10 * * 1-5")    JOB=brokers ;;
            "45 13 * * 1-5")    JOB=disposal ;;
            "8 12 * * 1-5")     JOB=borrow ;;
            "30 14 * * 1-5")    JOB=etf ;;
            "*/5 0-15 * * 1-5") JOB=announce ;;
            *)                  JOB="${{ github.event.inputs.job || 'all' }}" ;;
          esac
          echo "job=$JOB" >> "$GITHUB_OUTPUT"

      - name: 執行
        run: |
          if [ "${{ steps.pick.outputs.job }}" = "backfill" ]; then
            python -m pipeline.run backfill 120 && python -m pipeline.run all
          else
            python -m pipeline.run ${{ steps.pick.outputs.job }}
          fi

      - name: 存回資料
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data site/data themes.json
          if git diff --cached --quiet; then echo "沒有變更"; else
            git commit -m "data: ${{ steps.pick.outputs.job }} $(TZ=Asia/Taipei date '+%F %R')"
            git pull --rebase --autostash && git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
